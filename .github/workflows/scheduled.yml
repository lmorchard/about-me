name: Scheduled deploy to aerostat02
on:
  schedule:
    - cron:  '0 * * * *'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js 22.x
      uses: actions/setup-node@v4
      with:
        node-version: 22.x
    - name: Set git identity
      run: |
        git config --global user.email "me@lmorchard.com"
        git config --global user.name "Les Orchard"        
    - name: Yarn install
      run: yarn install
    - name: Build for production
      run: yarn run build:production
      env:
        YOUTUBE_USER_ID: ${{ secrets.YOUTUBE_USER_ID }}
        YOUTUBE_CHANNEL_ID: ${{ secrets.YOUTUBE_CHANNEL_ID }}
        YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
        TWITCH_USERNAME: ${{ secrets.TWITCH_USERNAME }}
        TWITCH_USERID: ${{ secrets.TWITCH_USERID }}
        TWITCH_CLIENTID: ${{ secrets.TWITCH_CLIENTID }}
        TWITCH_ACCESSTOKEN: ${{ secrets.TWITCH_ACCESSTOKEN }}
        ACTIVITYPUB_USERNAME: ${{ secrets.ACTIVITYPUB_USERNAME }}
        ACTIVITYPUB_BASE_URL: ${{ secrets.ACTIVITYPUB_BASE_URL }}
        ACTIVITYPUB_PROFILE_URL: ${{ secrets.ACTIVITYPUB_PROFILE_URL }}
        ACTIVITYPUB_OUTBOX_URL: ${{ secrets.ACTIVITYPUB_OUTBOX_URL }}
        GH_API_TOKEN: ${{ secrets.GH_API_TOKEN }}
        POCKETCASTS_EMAIL: ${{ secrets.POCKETCASTS_EMAIL }}
        POCKETCASTS_PASSWORD: ${{ secrets.POCKETCASTS_PASSWORD }}
        SPOTIFY_USERNAME: ${{ secrets.SPOTIFY_USERNAME }}
        SPOTIFY_CLIENTID: ${{ secrets.SPOTIFY_CLIENTID }}
        SPOTIFY_CLIENTSECRET: ${{ secrets.SPOTIFY_CLIENTSECRET }}
        SPOTIFY_ACCESS_TOKEN: ${{ secrets.SPOTIFY_ACCESS_TOKEN }}
        SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
        GOODREADS_USER_ID: ${{ secrets.GOODREADS_USER_ID }}
        GOODREADS_USER_NAME: ${{ secrets.GOODREADS_USER_NAME }}
        GOODREADS_KEY: ${{ secrets.GOODREADS_KEY }}
        GOODREADS_SECRET: ${{ secrets.GOODREADS_SECRET }}
    # about-me owns exactly these paths under /srv/www/lmorchard.com. The rest
    # of that directory -- images/, webfinger/, .well-known/, resume.html, the
    # 2017 archive -- is hand-maintained in lmorchard/lmorchard.com, whose
    # publish workflow runs `rsync --delete` and excludes this same list, so it
    # can neither revert nor remove what is generated here.
    #
    # That exclude list is a coupling between two repos, so this step fails the
    # build if build/ grows a path the list does not cover. Breaking here is the
    # point: the alternative is a new file publishing fine and then being
    # deleted an hour later by an unrelated push, which is far worse to debug.
    - name: Check build output against the agreed path list
      run: |
        expected=$(echo "assets bio.md index.css index.html index.json llms.txt resume.pdf" | xargs -n1 | sort | xargs)
        actual=$(cd build && ls -A | sort | xargs)
        if [ "$actual" != "$expected" ]; then
          echo "::error::build/ no longer matches the paths lmorchard.com excludes from --delete"
          echo "  expected: $expected"
          echo "  actual:   $actual"
          echo "Update this list AND the --exclude list in lmorchard/lmorchard.com/.github/workflows/publish.yml together."
          exit 1
        fi
        echo "build/ matches the agreed path list: $actual"

    - name: Set up SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/id_ed25519
        chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan -H aerostat02.lmorchard.com >> ~/.ssh/known_hosts

    # No --delete, deliberately. This publisher owns 7 paths in a directory of
    # 250-odd files, so --delete here would erase everything it does not
    # generate. The key is forced through rrsync server-side and confined to
    # /srv/www/lmorchard.com, which is why the path after the colon is empty.
    #
    # Flags are the ones the aerostat02 README documents as load-bearing:
    # -rlptvz or -a exit 23 against the root-owned site directory, after
    # transferring every file correctly -- a red build on a successful deploy.
    - name: Publish to aerostat02
      run: |
        rsync -rltvz --omit-dir-times -e 'ssh -i ~/.ssh/id_ed25519 -o IdentitiesOnly=yes' ./build/ webdeploy@aerostat02.lmorchard.com:
